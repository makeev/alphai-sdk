name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) when a v* tag is pushed.
# Configure the publisher once at https://pypi.org/manage/account/publishing/
# (project: alphai-sdk, workflow: release.yml, environment: pypi).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Verify tag and run checks on the release commit
        run: |
          uv venv
          uv pip install -e ".[dev]"
          PACKAGE_VERSION="v$(.venv/bin/python -c 'from alphai import __version__; print(__version__)')"
          test "$PACKAGE_VERSION" = "$GITHUB_REF_NAME"
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy src/alphai
          .venv/bin/pytest -q
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
