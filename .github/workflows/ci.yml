name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/alphai

      - name: Pytest (offline)
        run: pytest -q

  integration:
    name: live integration (optional)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: uv pip install --system -e ".[dev]"

      - name: Run live tests if a key is configured
        env:
          ALPHAI_API_KEY: ${{ secrets.ALPHAI_API_KEY }}
        run: |
          if [ -z "$ALPHAI_API_KEY" ]; then
            echo "No ALPHAI_API_KEY secret set — skipping live integration tests."
            exit 0
          fi
          pytest -m integration -q
